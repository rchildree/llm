<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/favicon/Winamp-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM: Latin learning machine</title>
    <script>
      // GitHub Pages serves 404.html for unknown paths. Restore the route that
      // public/404.html encoded before React Router starts.
      ;(function (location) {
        if (location.search.startsWith('?/')) {
          const route = location.search
            .slice(1)
            .split('&')
            .map((part) => part.replace(/~and~/g, '&'))
            .join('?')

          window.history.replaceState(null, '', `${location.pathname.slice(0, -1)}${route}${location.hash}`)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
